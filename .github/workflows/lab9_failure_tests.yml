name: Failure handling tests
on:
  workflow_dispatch:
  pull_request: {paths: ["src/validate_data.py", "src/mlops_pipeline/10_failure_injection.py", "config.yaml"]}
jobs:
  failure-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python src/mlops_pipeline/10_failure_injection.py
      - run: pytest tests/test_validation.py -q

name: CI - pipeline and tests
on:
  push: {branches: [main]}
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Run ML pipeline (stages 01-11)
        run: python src/mlops_pipeline/airline_prediction_pipeline.py
      - name: Run tests
        run: pytest -q
